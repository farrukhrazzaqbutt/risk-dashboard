services:
  backend:
    build:
      context: ./backend
    container_name: risk-dashboard-backend
    environment:
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: risk-dashboard-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
